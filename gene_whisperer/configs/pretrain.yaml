mlm:
  fasta_paths:
    - gene_whisperer/data/GCF_000005845.2_ASM584v2_genomic.fna
    - gene_whisperer/data/B_subtilis_genome
    - gene_whisperer/data/S_cerevisiae_genome
    - gene_whisperer/data/human_genome
    - gene_whisperer/data/pseudomonas_genome
    - gene_whisperer/data/japanese_rice_genome
  tokenizer_path: gene_whisperer/artifacts/bpe_tokenizer.json
  vocab_size: 4096
  max_length: 256
  window_size: 234
  mask_prob: 0.15
  max_bases_per_file: null
  tokenizer_max_bases: 10000000
  tokenizer_max_sequences: 5000
  tokenizer_window_size: 2048
  sample_by_length: true

model:
  embedding_dim: 320
  num_layers: 8
  num_heads: 8
  ff_dim: 1280
  dropout: 0.08

training:
  batch_size: 64
  epochs: 240
  min_epochs: 60
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0005
  save_best_only: true
  samples_per_epoch: 60000
  log_interval: 20
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.01
  grad_accum_steps: 2
  warmup_ratio: 0.06
  min_lr_ratio: 0.02
  max_grad_norm: 1.0
  use_amp: true
  seed: 1337
  output_dir: gene_whisperer/artifacts/mlm
