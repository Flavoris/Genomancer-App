stage1:
  train_path: gene_whisperer/data/stage1_train.tsv
  val_path: gene_whisperer/data/stage1_val.tsv
  tokenizer_path: gene_whisperer/artifacts/bpe_tokenizer.json
  use_pstnp: true

stage2:
  train_path: gene_whisperer/data/stage2_train.tsv
  val_path: gene_whisperer/data/stage2_val.tsv
  tokenizer_path: gene_whisperer/artifacts/bpe_tokenizer.json
  use_pstnp: true

model:
  embedding_dim: 256
  num_layers: 6
  num_heads: 8
  ff_dim: 1024
  dropout: 0.1
  max_length: 128

training:
  batch_size: 64
  epochs: 10
  lr: 0.00002
  weight_decay: 0.01
  grad_accum_steps: 1
  use_llrd: true
  layer_decay: 0.9
  seed: 1337
  output_dir: gene_whisperer/artifacts/finetune
