# Gene Whisperer Configuration v5.0 (Simplified Architecture)
#
# Architecture: Embedding -> 12-Layer Transformer -> Attention Pool ->
#               [Concat Engineered Features] -> Classifier
#
# This simplified architecture achieves:
# - 84.1% accuracy (vs 83.3% with CNN/TCN)
# - 23.9M parameters (vs 38.4M - 38% reduction)
# - Faster training (best at epoch 12 vs ~30-40)
# NOTE: Section maps are merged into the root for backward compatibility.

# == RANDOM SEED ==
seed: 1337

# == DATA SETTINGS (Stage 1/2 Training) ==
data: &data
  max_bp_len: 81  # Changed from 234 - matches benchmark dataset
  batch_size: 16
  delimiter: "\t"
  train_val_split: 0.9
  stage1_train: ../data/stage1_train.tsv
  stage1_val: ../data/stage1_val.tsv
  stage2_train: ../data/stage2_train.tsv
  stage2_val: ../data/stage2_val.tsv
  stage2_test: ../data/stage2_val.tsv
  stage2_strength_positive: 1
  stage2_strength_negative: 0
  cache_engineered_features: false
  cache_tokens: false

# == MLM-SPECIFIC DATA SETTINGS ==
# NOTE: These values are overridden by the mlm section below.
# Kept for backward compatibility but mlm section values take precedence.
mlm_data: &mlm_data
  mlm_max_bp_len: 234  # Longer sequences for general-purpose pretraining (DNABERT style)
  mlm_batch_size: 128
  mlm_window_size: 234  # DNABERT: pretrain on longer sequences, fine-tune on task-specific lengths

# == DATALOADER AND HARDWARE - OPTIMIZED FOR GOOGLE COLAB ==
hardware: &hardware
  num_workers: 8
  persistent_workers: true
  prefetch_factor: 4  # Increased from 2 for better GPU utilization
  pin_memory: true

# == MODEL ARCHITECTURE ==
model: &model
  # Model version: "v5" (simplified), "v6" (modern LLM), or legacy variants
  # v6 integrates all modern improvements: RoPE, SwiGLU, RMSNorm, optional GQA
  model_version: "v6"  # options: v5, v6
  embedding_dim: 384
  transformer_layers: 12
  transformer_heads: 12
  transformer_ff_dim: 1536
  transformer_dropout: 0.20  # Optimal from regularization experiment (86.55% val acc)
  model_variant: v6  # options: transformer_only, features_only, combined, v6
  use_glu_ffn: false  # Legacy param, use ffn_type instead
  glu_activation: "gelu"  # Legacy param for GLU FFN
  # SwiGLU and RMSNorm settings (modern LLM architecture from LLaMA/PaLM)
  ffn_type: "swiglu"  # Options: "gelu" (standard), "glu" (GLUFFN), "swiglu" (LLaMA/PaLM style)
  ffn_mult: 2.67  # SwiGLU expansion ratio (2.67x instead of 4x due to gating)
  norm_type: "rmsnorm"  # Options: "layernorm", "rmsnorm" (LLaMA/Mistral style)
  use_relative_position_bias: false  # Disabled when using RoPE
  relative_position_num_buckets: 32
  relative_position_max_distance: 128
  # Rotary Position Embedding (RoPE) - better relative position understanding
  use_rope: true
  rope_base: 10000.0
  # Positional Motif Bias - biases attention toward known promoter regulatory regions
  # For 81bp sequences centered on TSS: TATA box (~45-55), -10 box (~64-74), TSS (~75-81)
  use_positional_motif_bias: true
  motif_regions:
    tata_box: [45, 55]      # TATA box region (-35 to -25 bp from TSS)
    minus_10_box: [64, 74]  # -10 box region (-15 to -5 bp from TSS)
    tss: [75, 81]           # Transcription start site (most important)
  # Grouped Query Attention (GQA) - reduces parameters by sharing KV heads
  # Only used when model_variant: "v6" and use_gqa: true
  use_gqa: false
  num_kv_heads: 4  # Number of KV heads (must divide transformer_heads evenly)
  # Convenience flags for v6 architecture (can override ffn_type/norm_type)
  use_swiglu: true  # Use SwiGLU FFN (sets ffn_type: "swiglu" for v6)
  use_rmsnorm: true  # Use RMSNorm (sets norm_type: "rmsnorm" for v6)
  use_positional_bias: false  # Disabled for BPE (token positions don't map to fixed bp positions)
  use_attention_pool: true
  lstm_hidden: 192
  bpe_vocab_path: ../artifacts/vocabs/bpe_vocab.json
  vocab_size: 4096
  pad_token_id: 0
  max_token_len: 24          # For 81bp fine-tuning sequences (~4x BPE compression + headroom)
  mlm_max_token_len: 64      # For 234bp MLM pre-training sequences

# == SIMPLIFIED MODEL SETTINGS ==
# The simplified architecture removes CNN/TCN layers which were shown
# to hurt performance in ablation studies. This achieves 84.1% accuracy
# (up from 83.3%) with 38% fewer parameters.
simplified_model:
  # Pooling strategy: "mean", "attention", "cls", "max"
  pooling_type: "attention"

  # Classifier settings
  classifier_hidden: 256
  classifier_dropout: 0.20  # Optimal from regularization experiment (86.55% val acc)

  # Feature fusion: "concat" (simple concatenation)
  fusion_method: "concat"

# == ENGINEERED FEATURES ==
features: &features
  use_tnc: true
  use_pseeiip: true
  use_cksnap: true
  use_pstnp: true
  engineered_dim: 288  # 64 + 64 + 96 + 64
  engineered_mlp_hidden: 512
  engineered_mlp_output: 384
  fusion_hidden: 512
  stage1_use_engineered_features: true
  stage1_feature_enable_tnc: true
  stage1_feature_enable_pseeiip: true
  stage1_feature_enable_cksnap: true
  stage1_feature_enable_pstnp: true

# == TRAINING SETTINGS (Stage 1/2) ==
training: &training
  optimizer: "adamw"
  optimizer_foreach: true
  lr: 0.00002  # msBERT-aligned learning rate
  stage1_lr: 0.00002  # Explicit stage 1 learning rate
  stage2_lr: 0.00001  # Stage 2 can use lower LR for fine-tuning
  weight_decay: 0.05  # Optimal from regularization experiment (86.55% val acc)
  warmup_ratio: 0.10
  min_lr_ratio: 0.01  # Minimum LR as fraction of peak
  epochs: 100
  early_stopping_patience: 10  # Reduced from 15 for more aggressive stopping
  early_stopping_min_delta: 0.001  # Minimum improvement to reset patience
  early_stopping_restore_best: true  # Always restore best model weights on stop
  grad_accum_steps: 4
  grad_clip_norm: 1.0
  param_norm_warn: 400
  param_norm_cap: 500
  layer_lr_decay: 0.85
  drop_path_rate: 0.1

# == LOSS AND REGULARIZATION ==
loss: &loss
  stage1_use_focal_loss: false
  stage1_focal_alpha: 0.25
  stage1_focal_gamma: 2.0
  label_smoothing: 0.1  # Optimal from regularization experiment (86.55% val acc)
  # Bidirectional consistency loss for double-stranded DNA
  # Enforces agreement between forward and reverse complement predictions
  stage1_use_consistency_loss: true
  stage1_consistency_alpha: 0.3  # Weight for consistency term (0.0-1.0)

# == AUGMENTATION ==
augmentation: &augmentation
  use_mixup: true
  mixup_alpha: 0.2  # Increased from 0.1 for stronger regularization
  stage1_reverse_complement_prob: 0.5  # DNA is double-stranded

# == STOCHASTIC WEIGHT AVERAGING ==
swa: &swa
  use_swa: true
  swa_start_epoch: 80
  swa_lr: 0.00003
  swa_anneal_epochs: 10

# == STAGE-SPECIFIC OVERRIDES ==
stage_overrides: &stage_overrides
  stage1_label_smoothing: 0.0
  stage1_use_mixup: null
  stage1_mixup_alpha: null
  stage1_use_swa: null
  stage1_swa_start_epoch: null
  stage1_swa_lr: null
  stage1_drop_path_rate: null
  stage2_label_smoothing: 0.0
  stage2_use_mixup: false
  stage2_mixup_alpha: 0.0
  stage2_use_swa: false
  stage2_swa_start_epoch: null
  stage2_swa_lr: null
  stage2_drop_path_rate: 0.0

# == MLM PRETRAINING ==
mlm: &mlm
  stage1_load_mlm_weights: true
  stage2_load_mlm_weights: false
  stage1_mlm_transfer_mode: embed_plus_adapter
  stage2_mlm_transfer_mode: embed_plus_adapter
  stage1_freeze_layers: 0
  stage1_unfreeze_epoch: null
  mlm_encoder_checkpoint: ../artifacts/mlm_encoder_k6.pt
  include_reverse_complements: true
  mlm_fasta_path: ../data/GCF_000005845.2_ASM584v2_genomic.fna
  mlm_fasta_paths:
    - ../data/GCF_000005845.2_ASM584v2_genomic.fna
    - ../data/B_subtilis_genome
    - ../data/S_cerevisiae_genome
    - ../data/human_genome
    - ../data/pseudomonas_genome
    - ../data/japanese_rice_genome
  mlm_species_weights: [0.45, 0.35, 0.20, 0.20, 0.20, 0.20]
  mlm_steps_per_epoch: 5000
  mlm_unknown_base_strategy: "skip"
  mlm_window_size: 234  # DNABERT style: pretrain on longer sequences (10-510bp), fine-tune on task-specific
  mlm_stride: 20
  mlm_batch_size: 128
  mlm_epochs: 200
  # MLM-specific learning rate (separate from stage training)
  mlm_lr: 0.0005  # Increased from 0.0002 to help escape mode collapse
  mlm_weight_decay: 0.01
  mlm_max_span_len: 1        # Independent token masking for BPE (tokens already multi-base)
  mlm_encoder_checkpoint: ../artifacts/mlm_encoder_bpe.pt
  mlm_embedding_dim: 384
  mlm_transformer_layers: 12
  mlm_transformer_heads: 12
  mlm_transformer_ff_dim: 1536
  mlm_transformer_dropout: 0.1
  mlm_tie_weights: false  # Disabled to help prevent mode collapse (allows different input/output representations)
  mlm_use_output_norm: true
  # CLIP-style projection uses normalized cosine similarity - NOT recommended for MLM
  # Standard linear projection (mlm_use_clip_projection: false) achieves much higher accuracy
  mlm_use_clip_projection: false
  mlm_use_layer_lr_decay: false
  mlm_layer_lr_decay: 0.9
  mlm_val_ratio: 0.1
  mlm_val_exclude_patterns: ["mitochond", "plastid", "chloroplast"]
  mlm_min_val_records_per_species: 1
  mlm_single_record_val_ratio: 0.1
  mlm_grad_accum_steps: 16  # Effective batch = 128 * 16 = 2048 (DNABERT uses 2000)
  mlm_warmup_ratio: 0.06
  mlm_final_lr_ratio: 0.1
  mlm_lr_log_interval: 50
  mlm_patience: 30
  mlm_checkpoint_keep_last: 2
  mlm_mask_prob: 0.15
  mlm_masking:
    # Masking configuration for BPE tokenization
    # For BPE, use max_span_len=1 (independent token masking) since each token already
    # represents a variable-length DNA segment. Using span masking would remove too much context.
    progressive: false
    initial_mask_rate: 0.15
    final_mask_rate: 0.20
    transition_start_ratio: 0.8
    max_span_len: 1  # IMPORTANT: Use 1 for BPE (tokens are already multi-base)
    span_distribution: "geometric"
    mean_span: 1.0  # With max_span_len=1, this doesn't matter but set to 1 for clarity
    exclude_special_from_labels: true
  # Length curriculum: gradually increases sequence length during training
  # NOTE: Automatically disabled when using streaming datasets (mlm_fasta_paths + mlm_steps_per_epoch)
  # Set to false to avoid the warning when using streaming
  mlm_length_curriculum_enabled: false
  mlm_length_curriculum_start_tokens: 32
  mlm_length_curriculum_end_tokens: 229  # 234 - k + 1 for k=6 (matches mlm_window_size)
  mlm_length_curriculum_start_pct: 0.0
  mlm_length_curriculum_end_pct: 0.3

# == CHECKPOINTS ==
checkpoints: &checkpoints
  # MLM encoder checkpoints per k-mer
  mlm_encoder_ckpt_by_k:
    3: ../artifacts/mlm_encoder_k3.pt
    4: ../artifacts/mlm_encoder_k4.pt
    5: ../artifacts/mlm_encoder_k5.pt
    6: ../artifacts/mlm_encoder_k6.pt

  # Metadata files per k-mer
  mlm_metadata_by_k:
    3: ../artifacts/mlm_encoder_k3_metadata.json
    4: ../artifacts/mlm_encoder_k4_metadata.json
    5: ../artifacts/mlm_encoder_k5_metadata.json
    6: ../artifacts/mlm_encoder_k6_metadata.json

  # Stage 1 checkpoints (unchanged)
  stage1_checkpoint_name: null
  stage1_checkpoint_name: stage1_bpe.pt

# == VISUALIZATION ==
visualization: &visualization
  stage1_embed_plot_epoch: null
  stage1_embed_plot_method: pca
  stage1_embed_plot_samples: 512

# == METRICS ==
metrics: &metrics
  metrics_stage1: ["accuracy", "precision", "recall", "f1", "mcc", "specificity"]
  metrics_stage2: ["accuracy", "mcc", "roc_auc"]

# == ENSEMBLE WEIGHTS ==
ensemble:
  optimize_weights: true
  optimization_metric: "mcc"
  min_weight: 0.05
  weights_path: ../artifacts/ensemble_weights.json

# == INFERENCE SETTINGS ==
# Test-time augmentation (TTA) using reverse complement
inference:
  use_tta: true
  tta_aggregation: "mean"  # Options: "mean", "geometric_mean"
  # TTA uses DNA reverse complement to average predictions over both strands
  # Expected improvement: +0.3-0.5% accuracy

# == TRANSFER SMOKETEST ==
smoketest: &smoketest
  smoketest_steps_pretrain: 300
  smoketest_steps_stage1: 300
  smoketest_steps_stage2: 300

# == MIXED PRECISION (AMP) ==
amp: &amp
  amp_enabled: true
  amp_dtype: "float16"
  amp_force_fp32_loss: true

# == BPE MLM PRETRAINING ==
bpe_pretrain: &bpe_pretrain
  # BPE vocabulary is trained once, then used for all MLM pre-training
  # Run train_bpe_vocab.py first to generate the vocabulary
  bpe_vocab_size: 4096  # DNABERT-2 optimal (Fig 3c)

# == EARLY STOPPING FOR PRETRAINING ==
# Now with intelligent convergence detection to prevent wasted compute
pretrain_early_stopping: &pretrain_early_stopping
  # Enable early stopping during pretraining
  mlm_early_stopping_enabled: true

  # Metric to monitor (validation loss)
  mlm_early_stopping_metric: "val_loss"

  # BPE pre-training convergence settings
  mlm_early_stopping_patience: 15
  mlm_early_stopping_min_epochs: 12

  # Patience: epochs to wait for improvement (overridden by k-mer defaults)
  mlm_early_stopping_patience: 15

  # Minimum delta: minimum change to qualify as improvement
  mlm_early_stopping_min_delta: 0.001

  # Minimum epochs before early stopping can trigger (overridden by k-mer defaults)
  mlm_early_stopping_min_epochs: 10

  # Restore best weights when stopping
  mlm_early_stopping_restore_best: true

  # == INTELLIGENT CONVERGENCE DETECTION ==
  # These settings detect when training is making minimal progress

  # Accuracy stagnation: stop if accuracy improves less than threshold over window
  mlm_accuracy_stagnation_window: 5      # Number of epochs to check
  mlm_accuracy_stagnation_threshold: 0.01  # Min improvement required (1%)

  # Rate of change: stop if improvement rate drops below minimum
  mlm_rate_of_change_window: 10          # Number of epochs to calculate rate
  mlm_rate_of_change_min_improvement: 0.005  # Min improvement per epoch

  # "Good enough" thresholds: stop early if these targets are reached
  # These prevent wasting compute when performance is already satisfactory
  # Set to null to use k-mer specific defaults, or override with specific value
  mlm_target_accuracy: null  # Uses k-mer defaults (85% for k=3, 78% for k=6)
  mlm_target_loss: 0.5       # Stop if loss drops below this

# == ABLATION / SCORING ==
ablation:
  enabled: false
  seeds: [1337]
  pretrain_bp_limit: 200000
  pretrain_max_steps: 300
  pretrain_epochs: 5
  stage1_max_train_samples: 2048
  stage1_max_val_samples: 2048
  stage1_max_steps: 300
  stage1_epochs: 5
  stage2_max_train_samples: 2048
  stage2_max_val_samples: 2048
  stage2_max_steps: 300
  stage2_epochs: 5
  compute_transfer_efficiency: true
  transfer_efficiency_mode: per_total_second
  cost_mode: deploy_params
  score_weights:
    pretrain: 0.15
    stage1: 0.35
    stage2: 0.35
    transfer: 0.15
    cost: 0.10
  distill_base_variant: baseline
  negligible_score_drop: 0.01
  min_cost_improvement: 0.03

# == KNOWLEDGE DISTILLATION ==
distill:
  enabled: false
  alpha: 0.5
  temperature: 2.0
  teacher_ckpt: ../artifacts/checkpoints/stage1_bpe.pt

# == MERGED ROOT KEYS (BACKWARD COMPATIBILITY) ==
<<: *data
<<: *mlm_data
<<: *hardware
<<: *model
<<: *features
<<: *training
<<: *loss
<<: *augmentation
<<: *swa
<<: *stage_overrides
<<: *mlm
<<: *checkpoints
<<: *visualization
<<: *metrics
<<: *smoketest
<<: *amp
<<: *bpe_pretrain
<<: *pretrain_early_stopping
