# Baseline config (no optimizations) for profiling comparison
# Inherits most settings from config.yaml but disables AMP and optimizer_foreach

# =============================================================================
# RANDOM SEED
# =============================================================================
seed: 1337

# =============================================================================
# DATA SETTINGS
# =============================================================================
max_bp_len: 81
batch_size: 32
delimiter: "\t"
train_val_split: 0.9

num_workers: 0
persistent_workers: false
cache_engineered_features: false
cache_tokens: false

stage1_train: ../data/stage1_train.tsv
stage1_val: ../data/stage1_val.tsv
stage2_train: ../data/stage2_train.tsv
stage2_val: ../data/stage2_val.tsv
stage2_test: ../data/stage2_val.tsv
stage2_strength_positive: 1
stage2_strength_negative: 0

# =============================================================================
# MODEL ARCHITECTURE
# =============================================================================
embedding_dim: 256
transformer_layers: 6
transformer_heads: 8
transformer_ff_dim: 1024
transformer_dropout: 0.15

use_attention_pool: true
kmer: 3
stage2_kmer: 6
vocab_size: 67
pad_token_id: 66
vocab_cache_dir: ../artifacts/vocabs

# TCN + Multi-scale CNN
use_tcn: true
tcn_hidden: 256
tcn_levels: 4
tcn_kernel: 3
multiscale_channels: 64
multiscale_kernels: [3, 5, 7, 9, 15]
lstm_hidden: 192
post_cnn_transformer_layers: 3
stage1_use_engineered_features: true
engineered_dim: 128
engineered_mlp_hidden: 256
engineered_mlp_output: 128
fusion_hidden: 256
stage1_reverse_complement_prob: 0.5

# =============================================================================
# TRAINING SETTINGS
# =============================================================================
optimizer: "adamw"

# BASELINE: Disable optimizer_foreach
optimizer_foreach: false

lr: 0.0002
weight_decay: 0.02
warmup_ratio: 0.15
epochs: 120
early_stopping_patience: 25
grad_accum_steps: 4
grad_clip_norm: 1.0
layer_lr_decay: 0.8
drop_path_rate: 0.1

# Loss function
stage1_use_focal_loss: true
stage1_focal_alpha: 0.5
stage1_focal_gamma: 2.0
label_smoothing: 0.05

# Augmentation
use_mixup: true
mixup_alpha: 0.2

# SWA
use_swa: true
swa_start_epoch: 60
swa_lr: 0.00005
swa_anneal_epochs: 10

# MLM settings
stage1_load_mlm_weights: true
stage2_load_mlm_weights: false
stage1_mlm_transfer_mode: embed_only
stage2_mlm_transfer_mode: embed_only
stage1_freeze_layers: 0
mlm_encoder_checkpoint: ../artifacts/mlm_encoder_k3.pt

# =============================================================================
# MIXED PRECISION (DISABLED FOR BASELINE)
# =============================================================================
amp_enabled: false
amp_dtype: "bfloat16"
amp_force_fp32_loss: true
